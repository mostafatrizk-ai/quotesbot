<!DOCTYPE html>
<html dir="rtl">
<head>
  <meta charset="UTF-8" />
  <style>
    body { width: 260px; margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: #111b21; color: #e9edef; font-size: 13px; }
    .hd { padding: 10px 12px; background: #202c33; font-weight: 700; }
    .st { padding: 10px 12px; line-height: 1.9; }
    .btns { display: flex; gap: 6px; padding: 10px 12px; }
    button { flex: 1; padding: 7px; border: none; border-radius: 8px; cursor: pointer; background: #2a3942; color: #e9edef; }
    button.p { background: #d34f4f; color: #fff; }
    a { color: #00a884; }
  </style>
</head>
<body>
  <div class="hd">🚀 WA Outreach Pro</div>
  <div class="st" id="st">…جارٍ قراءة الحالة</div>
  <div class="btns">
    <button id="pause">⏸ إيقاف مؤقت</button>
    <button id="estop" class="p">⛔ E-STOP</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
